# Optional, and no longer needed for backups: scripts/backup.sh streams the dump out of the
# backup container and encrypts it on the host into BACKUP_HOST_DIR (set that in .env to keep
# backups elsewhere). The installer and docs/DEPLOYMENT.md use docker-compose.yml alone on
# Linux. Kept so that a setup which already includes this file keeps working; it binds a
# deliberately provisioned, owned, protected LINUX_BACKUP_HOST_DIR into the backup container.
services:
  backup:
    volumes:
      - type: bind
        source: ${LINUX_BACKUP_HOST_DIR:?Set LINUX_BACKUP_HOST_DIR before using the Linux template}
        target: /backups
      - type: bind
        source: ./scripts
        target: /scripts
        read_only: true
