version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # uv.lock needs the dedicated uv updater, rather than pip.
  # https://docs.astral.sh/uv/guides/integration/dependabot/
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
